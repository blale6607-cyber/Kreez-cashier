name: Build KREEZ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KREEZ_Android_Project_Protected.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        run: |
          yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract project
        run: unzip -o KREEZ_Android_Project_Protected.zip -d source
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: source/KREEZ_Android_Project
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KREEZ-APK
          path: source/KREEZ_Android_Project/app/build/outputs/apk/debug/app-debug.apk
